name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  API_KEY: TEST_API_KEY

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Set up Java (required for Gradle)
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu' # Or 'temurin'
          java-version: '17'   # Project targets JDK 17
          cache: gradle

      # Step 3: Android SDK is preinstalled on ubuntu-latest runners, including
      # platform 37 and build-tools 37.0.0 (matching app/build.gradle.kts), so no
      # separate setup-android step is needed.

      # Step 4: Install dependencies
      - name: Gradle dependencies
        run: ./gradlew dependencies --scan --parallel

      # Step 5: Build the project
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Step 6: Run tests
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

    # Step 7: Run instrumented tests (Optional)
    # Uncomment if you have connectedDebugAndroidTest tests
    # - name: Run instrumented tests
    #   run: ./gradlew connectedDebugAndroidTest